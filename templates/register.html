<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SquadUp</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/register.css') }}">
</head>

<body>

<div class="register-page">

    <!-- HERO SECTION -->

    <div class="register-hero">

        <div class="hero-icon icon-one">🏸</div>
        <div class="hero-icon icon-two">⚽</div>
        <div class="hero-icon icon-three">🏀</div>
        <div class="hero-icon icon-four">🏓</div>

        <h1>
            Create Your <span>SquadUp</span> Profile
        </h1>

        <p>
            Join the game. Build your squad.
        </p>

    </div>

    <!-- REGISTER FORM -->

    <div class="register-card">

        <form method="POST" action="{{ url_for('register') }}">

            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                name="username"
                required
            >

            <label for="full_name">Full Name</label>

            <input
                type="text"
                id="full_name"
                name="full_name"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                required
            >

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                required
            >

            <label for="skill_level">Skill Level</label>

            <select
                id="skill_level"
                name="skill_level"
                required
            >
                <option value="">
                    Select Skill Level
                </option>

                <option value="Beginner">
                    Beginner
                </option>

                <option value="Intermediate">
                    Intermediate
                </option>

                <option value="Advanced">
                    Advanced
                </option>
            </select>

            <h3>Choose Your Avatar</h3>

            <div class="avatar-grid">

                <label class="avatar-card">
                    <input type="radio" name="avatar" value="avatar_1.png" required>
                    <img src="{{ url_for('static', filename='images/avatar_1.png') }}">
                </label>

                <label class="avatar-card">
                    <input type="radio" name="avatar" value="avatar_2.png">
                    <img src="{{ url_for('static', filename='images/avatar_2.png') }}">
                </label>

                <label class="avatar-card">
                    <input type="radio" name="avatar" value="avatar_3.png">
                    <img src="{{ url_for('static', filename='images/avatar_3.png') }}">
                </label>

                <label class="avatar-card">
                    <input type="radio" name="avatar" value="avatar_4.png">
                    <img src="{{ url_for('static', filename='images/avatar_4.png') }}">
                </label>

                <label class="avatar-card">
                    <input type="radio" name="avatar" value="avatar_5.png">
                    <img src="{{ url_for('static', filename='images/avatar_5.png') }}">
                </label>

                <label class="avatar-card">
                    <input type="radio" name="avatar" value="avatar_7.png">
                    <img src="{{ url_for('static', filename='images/avatar_7.png') }}">
                </label>

                <label class="avatar-card">
                    <input type="radio" name="avatar" value="avatar_12.png">
                    <img src="{{ url_for('static', filename='images/avatar_12.png') }}">
                </label>

                <label class="avatar-card">
                    <input type="radio" name="avatar" value="avatar_14.png">
                    <img src="{{ url_for('static', filename='images/avatar_14.png') }}">
                </label>

                <label class="avatar-card">
                    <input type="radio" name="avatar" value="avatar_16.png">
                    <img src="{{ url_for('static', filename='images/avatar_16.png') }}">
                </label>

            </div>

            <button type="submit">
                Create Account
            </button>

        </form>

        <p class="bottom-text">
            Already have an account?
            <a href="{{ url_for('login') }}">
                Login here
            </a>
        </p>

        <a href="{{ url_for('home') }}"
           class="home-link">
            Back to Home
        </a>

    </div>

</div>

</body>
</html>
