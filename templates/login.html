<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - SquadUp</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>

<div class="login-page">

    <div class="floating-ball ball-1">⚽</div>
    <div class="floating-ball ball-2">🏀</div>
    <div class="floating-ball ball-3">🏸</div>
    <div class="floating-ball ball-4">🏐</div>

    <div class="login-card">

        <div class="logo">SQUAD<span>UP</span></div>

        <h1>Welcome <span>Back</span></h1>

        <p class="subtitle">Login to explore your squad</p>

        <form method="POST">

            <label>Username</label>
            <div class="input-box">
                <span class="input-icon">👤</span>
                <input type="text"
                       name="username"
                       placeholder="Enter your username"
                       required>
            </div>

            <label>Password</label>
            <div class="input-box">
                <span class="input-icon">🔒</span>
                <input type="password"
                       name="password"
                       placeholder="Enter your password"
                       required>
            </div>

            <button type="submit">Login</button>

        </form>

        <p class="bottom-text">
            Don't have an account?
            <a href="{{ url_for('register') }}">Register here</a>
        </p>

        <a href="{{ url_for('home') }}" class="home-link">
            ← Back to Home
        </a>

    </div>

</div>

</body>
</html>
